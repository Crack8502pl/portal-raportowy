version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: portal-raportowy-db
    environment:
      POSTGRES_DB: portal_raportowy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - portal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portal_raportowy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Portal Raportowy Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal-raportowy-app
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=portal_raportowy
      - DB_USER=postgres
      - DB_PASSWORD=admin
      - JWT_SECRET=your_production_jwt_secret_change_this_in_production
      - JWT_EXPIRES_IN=24h
      - MAX_FILE_SIZE=10485760
      - RATE_LIMIT_MAX=100
      - RATE_LIMIT_WINDOW=900000
      - FRONTEND_URL=http://localhost:3000
      # Email configuration (set these in production)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@portal-raportowy.com}
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/backend/uploads
      - ./config/.env:/app/config/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - portal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: portal-raportowy-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
      # SSL certificates (uncomment for HTTPS)
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - portal-network
    restart: unless-stopped
    profiles:
      - production

  # Redis Cache (optional, for session storage)
  redis:
    image: redis:7-alpine
    container_name: portal-raportowy-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - portal-network
    restart: unless-stopped
    profiles:
      - cache

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  nginx_logs:
    driver: local
  redis_data:
    driver: local

networks:
  portal-network:
    driver: bridge